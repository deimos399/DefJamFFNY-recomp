
name: Android SDL3 ARM64 test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"

      - name: Download SDL3
        run: git clone --depth 1 https://github.com/libsdl-org/SDL.git SDL

      - name: Configure SDL3 for Android
        run: |
          cmake -S SDL -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build SDL3
        run: cmake --build build-android --parallel 2
        
