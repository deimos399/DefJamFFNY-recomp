
name: Build official SDL3 Android test

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Download SDL3
        run: git clone --depth 1 https://github.com/libsdl-org/SDL.git SDL

      - name: Generate official SDL3 test app
        working-directory: SDL
        run: |
          python3 build-scripts/create-android-project.py \
            org.libsdl.testspriteminimal \
            test/testspriteminimal.c \
            test/icon.h

      - name: Build APK
        working-directory: SDL/build/org.libsdl.testspriteminimal
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SDL3-Official-Test-APK
          path: SDL/build/org.libsdl.testspriteminimal/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
